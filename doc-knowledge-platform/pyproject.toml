[project]
name = "doc-knowledge-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sribastav Rajguru", email = "prajguru54@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
doc-knowledge-platform = "doc_knowledge_platform:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "reportlab>=5.1.0",
]
